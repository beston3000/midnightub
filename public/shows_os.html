<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="index.css" />
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
	
    <script src="/scram/scramjet.all.js"></script>
	<script src="baremux/index.js" defer></script>
	<script src="epoxy/index.js" defer></script>
	<script src="register-sw.js" defer></script>
	<script src="search.js" defer></script>
	<script src="index.js" defer></script>

	<style>
		:root {
			--accent-primary: #00f3ff;
			--accent-secondary: #bc13fe;
			--text-main: #e0f7fa;
			--text-muted: #8aa3ac;
		}

		* { box-sizing: border-box; }
        
        /* Bubbly OS Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.5); }

		body {
			margin: 0; height: 100vh;
			background-color: transparent;
			color: var(--text-main); font-family: 'Rajdhani', sans-serif;
			overflow: hidden; display: flex; flex-direction: column;
		}

		/* GHOST UI: HIDDEN BUT REQUIRED BY INDEX.JS */
		.browser-controls, .tabs-bar { display: none !important; }
		#sj-error, #sj-error-code { display: none; }

		/* Viewport Overlay */
		.viewport { display: none; position: fixed; inset: 0; z-index: 100; background: #000; overflow: hidden; }
		.view { position: absolute; inset: 0; display: none; }
		.view.active { display: block; }
		.frame-host { width: 100%; height: 100%; border: none; background: #000; }

		#player-close {
			display: none; position: fixed; top: 15px; right: 15px; z-index: 101;
			background: rgba(255, 42, 42, 0.1); border: 1px solid #ff4a4a; color: #ff4a4a;
			padding: 8px 16px; cursor: pointer; border-radius: 20px; font-family: 'Rajdhani'; font-weight: bold; transition: 0.2s;
		}
		#player-close:hover { background: #ff4a4a; color: #000; box-shadow: 0 0 15px #ff4a4a; }

		/* UI Layout */
		#trending-shows {
			flex: 1; 
            padding: 20px 20px 0 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            min-height: 0; 
            overflow: hidden;
		}

		.tm-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;}
		
        .tm-header-left { display: flex; align-items: center; gap: 15px; }
        .tm-header h2 { margin: 0; font-family: 'Orbitron'; font-size: 24px; color: var(--accent-primary); }

        /* Drill-down Back Button */
		#back-btn {
			display: none;
			background: rgba(0, 243, 255, 0.1);
			border: 1px solid var(--accent-primary);
			color: var(--accent-primary);
			padding: 5px 15px;
            border-radius: 20px;
			font-family: 'Rajdhani', sans-serif;
			font-weight: 700;
			cursor: pointer;
			text-transform: uppercase;
			transition: all 0.2s;
		}
		#back-btn:hover { background: var(--accent-primary); color: #000; }

		#show-search {
			background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff;
			padding: 10px 15px; font-family: 'Space Grotesk'; font-size: 14px; width: 250px;
			outline: none; border-radius: 20px; transition: 0.3s;
		}
		#show-search:focus { border-color: var(--accent-primary); background: rgba(0, 0, 0, 0.8); }

		/* DYNAMIC SCROLLING GRID */
		.tm-scroll { 
            display: grid; 
            justify-content: center;
            gap: 20px; 
            overflow-y: auto; 
            padding-bottom: 40px; 
            flex: 1;
            align-content: start;
        }

        /* Class toggles for Posters vs Episodes */
        .tm-scroll.posters-grid { grid-template-columns: repeat(auto-fill, 160px); }
        .tm-scroll.episodes-grid { grid-template-columns: repeat(auto-fill, 280px); }

		/* Standard Poster Card */
		.movie-card {
			position: relative; background: rgba(15,20,30,0.5); border: 1px solid rgba(255,255,255,0.05);
			border-radius: 16px; transition: all 0.3s; display: flex; flex-direction: column; cursor: pointer; overflow: hidden;
            width: 160px;
            height: 300px;
		}
		.movie-card:hover { border-color: var(--accent-primary); box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: translateY(-5px); background: rgba(20,25,40,0.8); }

		.poster-wrapper { height: 240px; width: 100%; position: relative; background: rgba(0,0,0,0.5); flex-shrink: 0; }
		.poster-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s;}
        .movie-card:hover .poster-wrapper img { transform: scale(1.05); }

        /* Wider Episode Card Override */
        .movie-card.episode-card {
			width: 280px;
			height: 230px; 
		}
        .episode-card .poster-wrapper {
            height: 158px; /* 16:9 ratio of 280px */
        }

		.movie-rating {
			position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
			border: 1px solid var(--accent-secondary); border-radius: 8px; color: var(--accent-secondary);
			font-weight: bold; padding: 2px 8px; font-size: 12px;
		}
		.movie-info { 
            padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; flex: 1;
        }
		.movie-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; color: #fff; font-family: 'Space Grotesk'; }
		.movie-date { font-size: 11px; color: var(--text-muted); font-weight: 600;}
	</style>
</head>
<body>

    <div class="browser-controls">
        <div class="navbtns">
            <button class="navbtn" id="navBack"></button>
            <button class="navbtn" id="navForward"></button>
            <button class="navbtn" id="navReload"></button>
        </div>
        <form id="sj-form">
            <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
            <input id="sj-address" type="text" />
        </form>
    </div>
    <div class="tabs-bar" id="tabs">
        <div class="tab active" data-id="1"><span class="label">Proxy</span><span class="close">✕</span></div>
        <div class="tab add" id="addTab">+</div>
    </div>

    <button id="player-close">✕ Close Player</button>

    <div class="viewport" id="views">
        <div class="view active" data-id="1">
            <div class="frame-host" hidden></div>
        </div>
    </div>

    <div id="trending-shows">
        <div class="tm-header">
            <div class="tm-header-left">
                <button id="back-btn">⟵ BACK</button>
                <h2>TV_DB</h2>
            </div>
            <div class="tm-search-container">
                <input type="text" id="show-search" placeholder="Search database..." autocomplete="off">
            </div>
        </div>
        <div class="tm-scroll posters-grid" id="tmdb-list">
            <div style="color:var(--text-muted); padding:20px; grid-column:1/-1; text-align:center;">INITIALIZING DATA STREAM...</div>
        </div>
    </div>

	<script>
		const TMDB_API_KEY = '1d776c7ac6fbdaea19620e1d667b0670';
		const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w300'; 
		const TMDB_STILL_BASE = 'https://image.tmdb.org/t/p/w500';

		const container = document.getElementById('tmdb-list');
		const titleElement = document.querySelector('.tm-header h2');
		const backBtn = document.getElementById('back-btn');
		const searchInput = document.getElementById('show-search');
		const viewport = document.querySelector('.viewport');
		const closeBtn = document.getElementById('player-close');
		const addressBar = document.getElementById('sj-address');
		const searchForm = document.getElementById('sj-form');

		// STATE MANAGEMENT
		let state = { view: 'shows', currentShow: null, currentSeason: null };

		function updateState(view, data = {}) {
			state.view = view;
			if (view === 'shows') {
				backBtn.style.display = 'none';
				state.currentShow = null;
				state.currentSeason = null;
                container.className = "tm-scroll posters-grid"; // Revert to vertical grid
				fetchTrending();
			} else if (view === 'seasons') {
				backBtn.style.display = 'block';
				state.currentShow = data.show;
				state.currentSeason = null;
				titleElement.innerText = data.show.name.toUpperCase();
                container.className = "tm-scroll posters-grid"; // Seasons use vertical grid
				renderSeasons(data.show.id);
			} else if (view === 'episodes') {
				backBtn.style.display = 'block';
				state.currentSeason = data.season;
				titleElement.innerText = `${state.currentShow.name} // S${data.season.season_number}`.toUpperCase();
                container.className = "tm-scroll episodes-grid"; // Swap to horizontal wider grid!
				renderEpisodes(state.currentShow.id, data.season.season_number);
			}
		}

		backBtn.onclick = () => {
			if (state.view === 'episodes') updateState('seasons', { show: state.currentShow });
			else updateState('shows');
		};

		closeBtn.onclick = () => {
			viewport.style.display = 'none';
			closeBtn.style.display = 'none';
			const frameHost = document.querySelector('.view.active .frame-host');
			if (frameHost) { frameHost.innerHTML = ''; frameHost.hidden = true; }
		};

		function launchPlayer(showId, seasonNum, episodeNum) {
			const targetUrl = `https://player.videasy.net/tv/${showId}/${seasonNum}/${episodeNum}`;
			viewport.style.display = 'block';
			closeBtn.style.display = 'block';
			addressBar.value = targetUrl;
			searchForm.dispatchEvent(new Event('submit', { cancelable: true }));
		}

		function renderTVList(shows) {
			if (!shows || shows.length === 0) {
				container.innerHTML = '<div style="padding:20px; color:var(--text-muted); grid-column:1/-1; text-align:center;">NO RESULTS FOUND</div>';
				return;
			}
            container.innerHTML = '';
			shows.forEach(show => {
				const card = document.createElement('div');
				card.className = 'movie-card';
				const rating = show.vote_average ? show.vote_average.toFixed(1) : 'N/A';
				const title = show.name || 'Unknown';
				const date = show.first_air_date ? show.first_air_date.split('-')[0] : 'N/A';
				
				let poster = 'https://via.placeholder.com/160x240/000000/00f3ff?text=No+Image';
				if (show.poster_path) poster = `/api/image?url=${encodeURIComponent(TMDB_IMAGE_BASE + show.poster_path)}`;

				card.onclick = () => updateState('seasons', { show: show });

				card.innerHTML = `
					<div class="poster-wrapper">
						<img src="${poster}" alt="${title}" loading="lazy">
						<div class="movie-rating">${rating}</div>
					</div>
					<div class="movie-info">
						<div class="movie-title" title="${title}">${title}</div>
						<div class="movie-date">${date}</div>
					</div>
				`;
				container.appendChild(card);
			});
		}

		async function renderSeasons(showId) {
			container.innerHTML = '<div style="padding:20px; color:var(--text-muted); grid-column:1/-1; text-align:center;">LOADING SEASONS...</div>';
			try {
				const response = await fetch(`https://api.themoviedb.org/3/tv/${showId}?api_key=${TMDB_API_KEY}`);
				const data = await response.json();
				container.innerHTML = '';
				if(data.seasons) {
					data.seasons.forEach(season => {
						if(season.season_number === 0 && season.name === "Specials") return; 

						const card = document.createElement('div');
						card.className = 'movie-card';
						const title = season.name;
						const count = `${season.episode_count} Episodes`;
						
						let poster = 'https://via.placeholder.com/160x240/000000/00f3ff?text=No+Image';
						if (season.poster_path) poster = `/api/image?url=${encodeURIComponent(TMDB_IMAGE_BASE + season.poster_path)}`;

						card.onclick = () => updateState('episodes', { season: season });

						card.innerHTML = `
							<div class="poster-wrapper">
								<img src="${poster}" alt="${title}" loading="lazy">
							</div>
							<div class="movie-info">
								<div class="movie-title">${title}</div>
								<div class="movie-date">${count}</div>
							</div>
						`;
						container.appendChild(card);
					});
				}
			} catch (error) { container.innerHTML = '<div style="padding:20px; color:#ff4444; grid-column:1/-1; text-align:center;">ERROR LOADING SEASONS</div>'; }
		}

		async function renderEpisodes(showId, seasonNum) {
			container.innerHTML = '<div style="padding:20px; color:var(--text-muted); grid-column:1/-1; text-align:center;">LOADING EPISODES...</div>';
			try {
				const response = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
				const data = await response.json();
				container.innerHTML = '';
				if(data.episodes) {
					data.episodes.forEach(ep => {
						const card = document.createElement('div');
						card.className = 'movie-card episode-card'; 
						const title = `${ep.episode_number}. ${ep.name}`;
						const airDate = ep.air_date || 'Unknown Date';
						
						let img = 'https://via.placeholder.com/280x158/000000/00f3ff?text=No+Image';
						if (ep.still_path) img = `/api/image?url=${encodeURIComponent(TMDB_STILL_BASE + ep.still_path)}`;
						else if (state.currentShow.backdrop_path) img = `/api/image?url=${encodeURIComponent(TMDB_STILL_BASE + state.currentShow.backdrop_path)}`;

						card.onclick = () => launchPlayer(showId, seasonNum, ep.episode_number);

						card.innerHTML = `
							<div class="poster-wrapper">
								<img src="${img}" alt="${title}" loading="lazy">
								<div class="movie-rating">EP ${ep.episode_number}</div>
							</div>
							<div class="movie-info">
								<div class="movie-title" title="${ep.name}">${title}</div>
								<div class="movie-date">${airDate}</div>
							</div>
						`;
						container.appendChild(card);
					});
				}
			} catch (error) { container.innerHTML = '<div style="padding:20px; color:#ff4444; grid-column:1/-1; text-align:center;">ERROR LOADING EPISODES</div>'; }
		}

		async function fetchTrending() {
			titleElement.innerText = "TV_DB";
			container.innerHTML = '<div style="padding:20px; color:var(--text-muted); grid-column:1/-1; text-align:center;">LOADING TRENDING...</div>';
			try {
				const response = await fetch(`https://api.themoviedb.org/3/trending/tv/day?api_key=${TMDB_API_KEY}`);
				const data = await response.json();
				renderTVList(data.results);
			} catch (error) { container.innerHTML = '<div style="padding:20px; color:#ff4444; grid-column:1/-1; text-align:center;">CONNECTION FAILED</div>'; }
		}

		async function searchShows(query) {
			if (!query) { updateState('shows'); return; }
			state.view = 'shows';
			backBtn.style.display = 'none';
            container.className = "tm-scroll posters-grid";

			titleElement.innerText = `SEARCH: "${query.toUpperCase()}"`;
			container.innerHTML = '<div style="padding:20px; color:var(--text-muted); grid-column:1/-1; text-align:center;">SEARCHING DATABASE...</div>';
			try {
				const response = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
				const data = await response.json();
				renderTVList(data.results);
			} catch (error) { container.innerHTML = '<div style="padding:20px; color:#ff4444; grid-column:1/-1; text-align:center;">SEARCH FAILED</div>'; }
		}

		searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchShows(searchInput.value); });
		searchInput.addEventListener('input', (e) => { if (e.target.value === '') updateState('shows'); });

		fetchTrending();
	</script>

    <script>
		(function() {
			const elementToObserve = document.querySelector('.viewport') || document.body;
			const poisonWindow = (win) => {
				if (!win) return;
				try {
					Object.defineProperty(win, 'open', { value: function() { return null; }, writable: false, configurable: false });
					Object.defineProperty(win, 'location', { get: function() { return window.location; }, set: function(val) {}, configurable: false });
				} catch(e) {}
			};
			const originalCreateElement = document.createElement;
			document.createElement = function(tagName) {
				const element = originalCreateElement.apply(document, arguments);
				if (tagName.toLowerCase() === 'iframe') {
					element.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin allow-pointer-lock');
					try {
						Object.defineProperty(element, 'contentWindow', {
							get: function() {
								poisonWindow(this.contentDocument ? this.contentDocument.defaultView : null);
								return this.contentDocument ? this.contentDocument.defaultView : null;
							}, configurable: true
						});
					} catch(e) {}
				}
				return element;
			};
			const suffocate = (e) => {
				const link = e.target.closest('a');
				if (link && link.target === '_blank') { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); }
			};
			window.addEventListener('click', suffocate, true);
			window.addEventListener('mousedown', suffocate, true);
			window.addEventListener('mouseup', suffocate, true);
			window.addEventListener('pointerup', suffocate, true);
		})();
	</script>
</body>
</html>
