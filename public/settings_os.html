<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Settings // Midnight OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-primary: #00f3ff;
            --accent-secondary: #bc13fe;
            --text-main: #e0f7fa;
            --text-muted: #627c85;
            --error: #ff4a4a;
        }

        * { box-sizing: border-box; }

        body { margin: 0; height: 100vh; font-family: 'Rajdhani', sans-serif; background-color: transparent; color: var(--text-main); overflow: hidden; }

        main { padding: 40px; transition: filter 0.3s; height: 100%; overflow-y: auto;}
        body.logged-out main { filter: blur(8px); pointer-events: none; }

        h1 { margin: 0 0 10px; font-family: "Orbitron"; font-size: 32px; color: var(--accent-primary); }
        p { margin: 0 0 30px; color: var(--text-muted); font-size: 16px;}

        .card {
            background: rgba(15, 20, 30, 0.5); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 30px; margin-bottom: 20px;
        }

        .btn {
            height: 44px; padding: 0 25px; border-radius: 22px; border: none;
            background: rgba(0, 243, 255, 0.1); color: var(--accent-primary);
            font-family: 'Rajdhani'; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s; border: 1px solid var(--accent-primary);
        }
        .btn:hover { background: var(--accent-primary); color: #000; box-shadow: 0 0 15px var(--accent-primary); }

        /* AUTH OVERLAY (Bubbly) */
        #authOverlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
        #authOverlay.hidden { opacity: 0; pointer-events: none; }
        .auth-content { width: 380px; padding: 40px; background: rgba(10, 15, 25, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .auth-view { display: none; }
        .auth-view.active { display: block; }
        .auth-content h2 { font-family: 'Orbitron'; color: var(--accent-primary); margin: 0 0 20px; }
        .app-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; outline: none; font-family: 'Space Grotesk'; }
        .app-input:focus { border-color: var(--accent-primary); }
        .btn-auth { width: 100%; padding: 12px; border-radius: 12px; border: none; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-primary { background: var(--accent-primary); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; }
    </style>
</head>
<body class="logged-out">

    <main>
        <h1>System Config</h1>
        <p>Manage connection parameters and session state.</p>

        <div class="card">
            <h2 style="color:var(--accent-secondary); font-family: Orbitron; margin-top:0;">STEALTH MODE</h2>
            <button class="btn" onclick="openGame()">Launch in Cloaked Tab</button>
        </div>

        <div class="card">
            <h2 style="color:var(--error); font-family: Orbitron; margin-top:0;">SESSION</h2>
            <button class="btn" style="border-color:var(--error); color:var(--error);" onclick="doLogout()">Disconnect</button>
        </div>
    </main>

    <script type="module">
        // Paste your Firebase Auth JS logic here
    </script>
</body>
</html>
