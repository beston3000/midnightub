<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat // Midnight OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="midnight-core.js"></script>

    <style>
        :root { --accent-primary: #00f3ff; --accent-secondary: #bc13fe; --text-main: #e0f7fa; --text-muted: #627c85; --error: #ff2a2a; }
        * { box-sizing: border-box; }
        
        /* Bubbly Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.2); border-radius: 10px; }

        body { margin: 0; height: 100vh; overflow: hidden; font-family: 'Rajdhani', sans-serif; background-color: transparent; color: var(--text-main); display: flex; flex-direction: column; }
        .app-container { display: flex; height: 100%; transition: filter 0.3s; background: rgba(10, 15, 30, 0.4); }
        body.logged-out .app-container { filter: blur(8px) brightness(0.4); pointer-events: none; }

        /* Sidebar */
        .chat-sidebar { width: 250px; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; background: rgba(5, 8, 16, 0.6); }
        .section-header { padding: 20px 15px 10px; font-family:'Orbitron'; color:var(--accent-secondary); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .add-btn { background: rgba(188, 19, 254, 0.1); border: 1px solid var(--accent-secondary); color: var(--accent-secondary); border-radius: 50%; cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; }
        .add-btn:hover { background: var(--accent-secondary); color: #000; }

        .channel-list { flex: 1; overflow-y: auto; padding: 5px 10px; display: flex; flex-direction: column; gap: 4px; }
        .channel-item { padding: 10px 15px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 15px; font-weight: 600; border-radius: 16px; display: flex; align-items: center; gap: 8px; }
        .channel-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .channel-item.active { background: rgba(0, 243, 255, 0.1); color: var(--accent-primary); }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 25px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        .header-controls { display: flex; gap: 10px; }
        .header-btn { background: rgba(0,243,255,0.1); border: 1px solid var(--accent-primary); color: var(--accent-primary); padding: 6px 14px; border-radius: 12px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; font-size: 13px; }
        .header-btn:hover { background: var(--accent-primary); color: #000; }

        .messages-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; }
        
        /* Input */
        .input-area { padding: 20px; background: rgba(0, 0, 0, 0.4); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; align-items: center; }
        .app-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid transparent; color: var(--text-main); font-family: 'Space Grotesk'; padding: 12px 20px; outline: none; border-radius: 20px; }
        .app-input:focus { border-color: var(--accent-primary); background: rgba(0,0,0,0.6); }
        .send-btn { background: var(--accent-primary); color: #000; border: none; border-radius: 20px; padding: 0 25px; height: 42px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .send-btn:hover { box-shadow: 0 0 15px var(--accent-primary); transform: scale(1.05); }
        .gif-btn { background: transparent; border: 1px solid var(--accent-secondary); border-radius: 20px; color: var(--accent-secondary); padding: 0 20px; height: 42px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; }
        .gif-btn:hover { background: var(--accent-secondary); color: #000; }

        /* Messages */
        .message-group { margin-bottom: 15px; display: flex; flex-direction: column; width: 100%; position: relative; }
        .message-content { max-width: 75%; padding: 10px 18px; margin-bottom: 2px; color: #fff; border-radius: 16px; background: rgba(255, 255, 255, 0.08); font-family: 'Space Grotesk'; font-size: 14px; position: relative; }
        .message-group.self .message-content { background: var(--accent-primary); color: #000; align-self: flex-end; }
        .detected-image { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 5px; }

        /* Modal */
        .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal.open { display: flex; }
        .modal-box { width: 400px; background: rgba(10, 15, 30, 0.95); border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); padding: 30px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; max-height: 80vh; }
        .modal-box h2 { margin: 0 0 20px; font-family: "Orbitron"; color: var(--accent-primary); font-size: 20px; text-align: center; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border-radius: 50%; border: none; color: #fff; width: 30px; height: 30px; cursor: pointer; }
    </style>
</head>
<body class="logged-out">
    <div class="app-container">
        </div>
    <script type="module">

    </script>
</body>
</html>
