<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-primary: #00f3ff;
      --text-main: #e0f7fa;
      --text-muted: #8aa3ac;
      --glass: rgba(0, 243, 255, 0.03);
      --border: rgba(0, 243, 255, 0.15);
    }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.5); }

    body {
      margin: 0;
      font-family: 'Rajdhani', sans-serif;
      background-color: transparent; 
      color: var(--text-main);
      overflow-y: auto; overflow-x: hidden;
    }

    .wrap { width: 100%; padding: 30px; margin: 0 auto; }

    .header {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; margin-bottom: 30px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); padding-bottom: 20px;
    }
    .header h1 {
      margin: 0; font-family: "Orbitron"; font-size: 32px;
      color: var(--accent-primary); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }
    .header p { margin: 5px 0 0; color: var(--text-muted); font-weight: 600; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .search, .sort {
      height: 44px; background: rgba(10, 15, 30, 0.6); border: 1px solid var(--border);
      color: var(--text-main); padding: 0 20px; font-family: 'Rajdhani'; font-size: 16px; 
      font-weight: 600; outline: none; border-radius: 22px; transition: all 0.3s;
    }
    .search:focus, .sort:focus { border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    .sort { cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

    .card {
      display: block; background: rgba(15, 20, 30, 0.5); border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 16px; text-decoration: none; color: inherit; overflow: hidden;
      transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .card:hover {
      transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 243, 255, 0.1);
      border-color: var(--accent-primary); background: rgba(20, 25, 40, 0.8);
    }

    .thumb { width: 100%; aspect-ratio: 16/10; background: rgba(0,0,0,0.5); display: grid; place-items: center; }
    .thumb img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5)); transition: transform 0.3s; }
    .card:hover .thumb img { transform: scale(1.1); }

    .meta { padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .name { font-weight: 700; font-size: 16px; font-family: 'Space Grotesk'; }
    .pill { font-size: 11px; color: #000; background: var(--accent-primary); padding: 4px 12px; font-weight: 700; border-radius: 10px; }
    .empty { padding: 40px; text-align: center; color: var(--text-muted); background: var(--glass); border-radius: 16px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>App Database</h1>
        <p>Accessing Utility Archives...</p>
      </div>
      <div class="controls">
        <input id="filter" class="search" placeholder="Search protocol..." autocomplete="off" />
        <select id="sort" class="sort">
          <option value="name-asc" selected>A-Z</option>
          <option value="name-desc">Z-A</option>
        </select>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>NO APPS FOUND</div>
  </div>

  <script>
    (async () => {
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const filter = document.getElementById("filter");
      const sort = document.getElementById("sort");

      let apps = [];
      try {
        const res = await fetch("apps.csv", { cache: "no-store" });
        const text = await res.text();
        const rows = parseCSV(text);

        apps = rows.map(r => ({
          id: r.id, appName: r.appName, appURL: r.appURL,
          appIcon: `./assets/images/${r.id}.webp`
        }));
      } catch (err) {
        empty.hidden = false; empty.textContent = "DATA LINK ERROR"; return;
      }

      const normalize = (s) => String(s || "").toLowerCase();
      const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      function parseCSV(text) {
        const lines = text.trim().split("\n");
        const headers = lines.shift().split(",").map(h => h.trim());
        return lines.map(line => {
          const values = line.split(",").map(v => v.trim());
          const obj = {};
          headers.forEach((h, i) => obj[h] = values[i] || "");
          return obj;
        });
      }

      function sortList(list) {
        const byName = (a, b) => String(a?.appName || "").localeCompare(String(b?.appName || ""));
        const sorted = [...list].sort(byName);
        if ((sort.value || "name-asc") === "name-desc") sorted.reverse();
        return sorted;
      }

      function render(list) {
        grid.innerHTML = "";
        if (!list.length) { empty.hidden = false; return; }
        empty.hidden = true;

        for (const a0 of list) {
          const a = document.createElement("a");
          a.className = "card";
          // Links to play.html. Note: play.html will load taking over the WHOLE browser tab, 
          // which is probably what you want for full-screen games/apps.
          a.href = `play.html?app=${encodeURIComponent(a0.id || a0.appName || "")}`;
          a.title = `Run ${a0.appName}`;
          a.innerHTML = `
            <div class="thumb"><img alt="${esc(a0.appName)}" src="${esc(a0.appIcon || "")}"></div>
            <div class="meta"><div class="name">${esc(a0.appName)}</div><div class="pill">OPEN</div></div>
          `;
          grid.appendChild(a);
        }
      }

      function apply() {
        const q = normalize(filter.value);
        const filtered = !q ? apps : apps.filter(a => normalize(a.appName).includes(q) || normalize(a.id).includes(q));
        render(sortList(filtered));
      }

      sort.value = "name-asc"; apply();
      filter.addEventListener("input", apply);
      sort.addEventListener("change", apply);
    })();
  </script>
</body>
</html>
